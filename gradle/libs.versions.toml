[versions]
adventure = "4.23.0"
adventure-platform = "4.4.1"
bstats = "3.1.0"
configmaster = "v2.0.0-rc.3"
snakeyaml = "2.0"
junit = "5.11.4"

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-platform-bungeecord = { module = "net.kyori:adventure-platform-bungeecord", version.ref = "adventure-platform" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
bstats-bungeecord = { module = "org.bstats:bstats-bungeecord", version.ref = "bstats" }
bstats-velocity = { module = "org.bstats:bstats-velocity", version.ref = "bstats" }
configmaster = { module = "com.github.thatsmusic99:ConfigurationMaster-API", version.ref = "configmaster" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Oldest API of each platform: what compiles here runs on all the newer versions.
spigot-api = { module = "org.spigotmc:spigot-api", version = "1.13.2-R0.1-SNAPSHOT" }
paper-api = { module = "com.destroystokyo.paper:paper-api", version = "1.16.5-R0.1-SNAPSHOT" }
paper-mojangapi = { module = "com.destroystokyo.paper:paper-mojangapi", version = "1.16.5-R0.1-SNAPSHOT" }
folia-api = { module = "dev.folia:folia-api", version = "1.20.4-R0.1-SNAPSHOT" }
velocity-api = { module = "com.velocitypowered:velocity-api", version = "3.4.0" }
waterfall-api = { module = "io.github.waterfallmc:waterfall-api", version = "1.21-R0.5-SNAPSHOT" }
